# Controlled egress gateway.
#
# The app container sits on a network marked `internal: true`, so Docker gives
# it no default route -- it cannot reach the internet, and that is a property of
# the network rather than a rule someone remembered to add. This proxy is the
# single deliberate opening: it is the only container on both networks, and it
# forwards exactly one destination.
#
# TCP passthrough, not TLS termination. The proxy never sees plaintext and never
# holds a key; certificates are validated end to end by the client against the
# real host. It moves bytes for one name and nothing else.
#
# Requires no root. `sudo nft` remains available as a host-level belt to these
# braces, but is no longer what the claim rests on.

events { worker_connections 512; }

error_log /dev/stderr warn;

# Ingress. Docker will not publish a port out of an internal network, and the
# app must stay on one, so the gateway carries the browser traffic in as well
# as the single permitted call out. The app itself still has no route anywhere.
http {
    access_log off;
    # Docker's embedded DNS. Resolving at request time rather than at startup
    # matters here: nginx exits if an upstream name does not resolve while it
    # is starting, and the app and this gateway depend on each other, so any
    # restart order could otherwise kill the gateway outright.
    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8117;
        location / {
            set $app_upstream "app:8117";
            proxy_pass http://$app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # The trace and the egress monitor are server-sent events: buffering
            # them would hold every step back until the run finished, which is
            # precisely the thing worth watching happen.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }
    }
}

stream {
    # Log every connection, so the gateway's own record can be compared against
    # what tcpdump observed.
    log_format egress '$time_iso8601 $remote_addr -> $upstream_addr '
                      '$status $bytes_sent/$bytes_received $session_time';
    access_log /dev/stdout egress;

    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;
    resolver_timeout 5s;

    server {
        listen 443;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
        # The one permitted destination. Adding a second means editing this file
        # and restarting the gateway -- a deliberate, reviewable act.
        set $allowed "integrate.api.nvidia.com:443";
        proxy_pass $allowed;
    }
}
